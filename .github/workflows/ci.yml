name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: xcode-27
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.404
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore TravBotSharp.sln --locked-mode

      - name: Build
        run: dotnet build TravBotSharp.sln -c Release --no-restore

      # Parser tests drive the runner's preinstalled Google Chrome through Patchright.
      - name: Test
        run: dotnet test --project MainCore.Test -c Release --no-build

      # Opens every Avalonia view headlessly so a binding that throws on activation fails CI.
      - name: Test views
        run: dotnet test --project AvaloniaUI.Test -c Release --no-build

      - name: Publish ${{ matrix.rid }}
        run: dotnet publish AvaloniaUI -c Release -r ${{ matrix.rid }} --self-contained -o publish/TBS-${{ matrix.rid }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: TBS-${{ matrix.rid }}
          path: publish/TBS-${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 3
