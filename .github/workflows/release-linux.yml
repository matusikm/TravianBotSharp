name: Release (Linux)

# Builds the Ubuntu packages (portable tarball + .deb) and publishes them as a GitHub Release.
# To release: push a tag like 1.2.0 (or v1.2.0), or run this workflow by hand and type a version.
# Pull requests that change the packaging only build and smoke-test the packages.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.0. The tag is created on the branch you run this from."
        required: true
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release-linux.yml"
      - "packaging/linux/**"

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release linux-x64
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            push) tag=$REF_NAME ;;
            workflow_dispatch) tag=$INPUT_VERSION ;;
            *) tag=0.0.0 ;;
          esac
          if [[ ! $tag =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Version '$tag' must look like 1.2.0 or v1.2.0"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Install dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.404
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore AvaloniaUI --locked-mode

      - name: Publish linux-x64
        run: >
          dotnet publish AvaloniaUI
          -c Release
          -r linux-x64
          --self-contained
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/linux-x64

      - name: Build tarball and .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEB_MAINTAINER: "${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>"
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: packaging/linux/build-packages.sh "$VERSION" publish/linux-x64 dist

      # Installs Google Chrome and both packages on a clean Ubuntu 26.04 and starts the app as a
      # normal user, so a missing dependency or a data-folder mistake fails here and not on a PC.
      - name: Smoke test on Ubuntu 26.04
        run: docker run --rm -v "$PWD:/work:ro" -w /work ubuntu:26.04 packaging/linux/smoke-test.sh dist

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: TBS-linux-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          ## Install on Ubuntu (26.04 or 24.04)

          TBS drives Google Chrome, so it needs Google's Chrome package. Chromium from snap does not work.
          Download \`travianbotsharp_${VERSION}_amd64.deb\` below, then in the same folder run:

          \`\`\`bash
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install ./google-chrome-stable_current_amd64.deb ./travianbotsharp_${VERSION}_amd64.deb
          \`\`\`

          Start **TravianBotSharp** from the app menu, or run \`travianbotsharp\`. The database, logs and Chrome profiles
          are kept in \`~/.local/share/TravianBotSharp\`. To update, install the newer .deb the same way.

          ### Portable tarball

          \`\`\`bash
          tar -xzf TravianBotSharp-${VERSION}-linux-x64.tar.gz -C ~
          ~/TravianBotSharp/TravianBotSharp
          \`\`\`

          The tarball keeps its data inside the extracted folder; extract a newer one over it to update.
          To move from the tarball to the .deb, copy \`TBS.db\` and \`Data/\` into \`~/.local/share/TravianBotSharp\`.

          Passwords in \`TBS.db\` are encrypted with \`~/.config/TravianBotSharp/secret.key\`, so keep that file too.
          Checksums are in \`SHA256SUMS\`.
          EOF

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "TravianBotSharp $VERSION" \
              --target "$GITHUB_SHA" \
              --notes-file "$notes" \
              --generate-notes
          fi
